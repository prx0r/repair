# Repair Garden — Source Registry (YAML)
# Machine-readable source definitions with snapshot_required flag
# Collection priority: (future_value × ephemerality) / collection_cost

sources:
  # === CAPABILITY ===
  - id: competent_person_register
    garden: repair
    domain: capability
    name: Registered Competent Person Electrical
    access:
      type: web_search
      cadence: daily
    temporal:
      recoverability: ephemeral
      snapshot_required: true
    rights:
      raw_storage: true
      derivatives: true
    produces:
      - provider
      - certification
      - capability
      - geography

  - id: mcs_installer_register
    garden: repair
    domain: capability
    name: MCS Installer Register
    access:
      type: dashboard
      cadence: daily
    temporal:
      recoverability: ephemeral
      snapshot_required: true
    produces:
      - provider
      - certification
      - capability

  - id: ozev_installers
    garden: repair
    domain: capability
    name: OZEV Approved Chargepoint Installers
    access:
      type: public_search
      cadence: weekly
    temporal:
      recoverability: recently_recoverable
      snapshot_required: false
    produces:
      - provider
      - certification
      - capability

  # === TRAINING ===
  - id: uk_apprenticeship_api
    garden: repair
    domain: training
    name: UK Apprenticeship Display Advert API
    access:
      type: api
      auth: api_key_free
      cadence: daily
    temporal:
      recoverability: ephemeral
      snapshot_required: true
    produces:
      - training_vacancy
      - capability
      - geography

  - id: ons_job_ads
    garden: repair
    domain: training
    name: ONS Labour Demand by SOC
    access:
      type: bulk_csv
      cadence: monthly
    temporal:
      recoverability: backfillable
      snapshot_required: false
    produces:
      - occupation_demand
      - capability

  # === LABOUR ===
  - id: adzuna_jobs
    garden: repair
    domain: labour
    name: Adzuna Jobs API
    access:
      type: api
      auth: api_key
      cadence: hourly
    temporal:
      recoverability: ephemeral
      snapshot_required: true
    produces:
      - vacancy
      - salary
      - geography
      - capability

  # === BUSINESSES ===
  - id: companies_house
    garden: repair
    domain: businesses
    name: Companies House REST API
    access:
      type: api
      auth: api_key
      cadence: daily
    temporal:
      recoverability: recently_recoverable
      snapshot_required: false
    rights:
      raw_storage: true
      derivatives: true
    produces:
      - company
      - geography
      - capability

  - id: companies_house_stream
    garden: repair
    domain: businesses
    name: Companies House Streaming API
    access:
      type: http_stream
      auth: stream_key
      cadence: continuous
    temporal:
      recoverability: ephemeral
      snapshot_required: true
    rights:
      raw_storage: true
      derivatives: true
    produces:
      - company_event

  # === DEMAND ===
  - id: contracts_finder
    garden: repair
    domain: demand
    name: Contracts Finder OCDS
    access:
      type: api
      cadence: daily
    temporal:
      recoverability: backfillable
      snapshot_required: false
    produces:
      - procurement_opportunity
      - capability
      - geography

  - id: find_a_tender
    garden: repair
    domain: demand
    name: Find a Tender OCDS
    access:
      type: api
      cadence: daily
    temporal:
      recoverability: backfillable
      snapshot_required: false
    produces:
      - procurement_opportunity

  - id: planning_data
    garden: repair
    domain: demand
    name: UK Planning Applications
    access:
      type: api
      cadence: daily
    temporal:
      recoverability: backfillable
      snapshot_required: false
    produces:
      - planning_application
      - geography

  # === REPAIR (physical objects) ===
  - id: open_repair_alliance
    garden: repair
    domain: repair_failure
    name: Open Repair Alliance
    access:
      type: bulk_csv
      cadence: weekly
    temporal:
      recoverability: backfillable
      snapshot_required: false
    licence: CC-BY-SA-4.0
    produces:
      - repair_record
      - device
      - fault

  - id: ebay_3market
    garden: repair
    domain: market_tape
    name: eBay UK 3-Market (broken/working/parts)
    access:
      type: scrape
      cadence: 6-hourly
    temporal:
      recoverability: ephemeral
      snapshot_required: true
    produces:
      - listing
      - device
      - price_curve

  - id: opss_recalls
    garden: repair
    domain: safety
    name: UK OPSS Product Recalls
    access:
      type: rss_feed
      cadence: daily
    temporal:
      recoverability: backfillable
      snapshot_required: false
    produces:
      - recall
      - device
      - fault

  - id: openalex
    garden: repair
    domain: research
    name: OpenAlex
    access:
      type: api
      cadence: weekly
    temporal:
      recoverability: permanent
      snapshot_required: false
    produces:
      - research_paper
