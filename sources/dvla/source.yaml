# Source: DVLA / DVSA
# Category: Vehicles / Transport
# Recoverability: third_party
# Cadence: daily

source_id: dvla
garden: repair
name: DVLA Vehicle Tax Check
source_type: api
description: >
  UK vehicle tax and MOT status. Used for: vehicle repair opportunities,
  EV conversion signals, parts demand by vehicle model.

cost: free
requires_api_key: false
api: https://www.check-mot.service.gov.uk/
licensing: government_open_data

expected_cadence: daily
freshness_sla_hours: 48

categories:
  - mot_failures
  - vehicle_tax
  - mot_history

fields:
  - registration
  - make
  - model
  - year
  - fuel_type
  - mot_status
  - mot_expiry
  - tax_status
  - tax_expiry

storage:
  format: jsonl
  partition: date
  path: data/hardware/vehicles/
