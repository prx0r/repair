# Layer 1 Source Manifest — Open Repair Alliance

id: open_repair
name: Open Repair Alliance
layer: 1
garden: repair

answers:
  - what_object_category?
  - what_brand?
  - what_problem?
  - was_repair_attempted?
  - what_was_outcome?
  - what_blocked_repair?
  - how_old_was_object?

source:
  authority: Open Repair Alliance
  type: bulk_csv
  url: https://raw.githubusercontent.com/openrepair/data/master/aggregated/202507/OpenRepairData_v0.3_aggregate_202507.csv
  format: csv

collection:
  cadence: weekly
  backfill_from: "2020-01-01"
  method: http_get
  parser: open_repair_csv_v1

storage:
  raw: true
  append_only: true
  content_addressed: true
  schema: source_record

time:
  source_timestamp_field: event_date
  observed_at: true
  append_only: true

health:
  expected_min_rows: 100
  max_staleness_hours: 168
  required_fields:
    - id
    - product_category
    - repair_status

license:
  name: CC-BY-SA-4.0
  redistribution: allowed
  attribution: required

export:
  k1_format: true
  node_kind: repair_record
  edge_pattern: device_REQUIRES_fix
