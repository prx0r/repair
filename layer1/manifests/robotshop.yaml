# Layer 1 Source Manifest — RobotShop UK

id: robotshop_uk
name: RobotShop UK
layer: 1
garden: repair

answers:
  - what_cost?
  - what_component?

source:
  authority: RobotShop UK
  type: web_scrape
  url: https://uk.robotshop.com
  format: html_jsonld

collection:
  cadence: 12h
  backfill_from: null
  method: http_get
  parser: robotshop_web_v1

storage:
  raw: true
  append_only: true
  content_addressed: true
  schema: source_record

time:
  source_timestamp_field: null
  observed_at: true
  append_only: true

health:
  expected_min_rows: 20
  max_staleness_hours: 24
  required_fields:
    - sku
    - name
    - price

license:
  name: proprietary
  redistribution: restricted

export:
  k1_format: true
  node_kind: listing
  observation_metric: price
